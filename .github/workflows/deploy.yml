name: Deploy

# Staging:    every push to refresh       → migrate + deploy --env staging
# Production: every pushed tag matching v* → migrate + deploy --env production
#
# Disabled until setup is finished (see SETUP.md, "Enabling deploys"):
#   - repo variable DEPLOY_ENABLED = true
#   - repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts, D1, R2: Edit) and CLOUDFLARE_ACCOUNT_ID
#   - real D1 database IDs and Access vars in wrangler.jsonc for the target environment
#
# Staging deploys from refresh, the v2 trunk, because main is still v1 until cutover.
# Switch it back to main as part of cutover (Phase 4).

on:
  push:
    branches: [refresh]
    tags: ['v*']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    env:
      CLOUDFLARE_ENV: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      # Migrations are additive-only, so applying them before the new code ships is safe.
      - run: pnpm exec wrangler d1 migrations apply DB --env "$CLOUDFLARE_ENV" --remote
      # The Vite plugin bakes the selected environment into the build output.
      - run: pnpm exec wrangler deploy
